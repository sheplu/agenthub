name: SAST

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    # x64 on purpose: the only sanctioned runner exception (semgrep arm
    # support unconfirmed).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Semgrep
        run: pipx install semgrep==1.146.0
      - name: Semgrep scan
        run: semgrep scan --config auto --error
