name: Quality Gates

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a1c52d2c570ee84cd1d1d1ff09d64d491e4d47c9 # v6.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a1c52d2c570ee84cd1d1d1ff09d64d491e4d47c9 # v6.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build & Package
    runs-on: ubuntu-24.04-arm
    env:
      MAX_PACKAGE_SIZE_KB: 256
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a1c52d2c570ee84cd1d1d1ff09d64d491e4d47c9 # v6.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build
        run: npm run build
      - name: Package dry-run and size budget check
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack-report.json
          node -e '
            const [pkg] = JSON.parse(require("node:fs").readFileSync("pack-report.json", "utf8"));
            const kb = Math.ceil(pkg.size / 1024);
            const max = Number(process.env.MAX_PACKAGE_SIZE_KB);
            console.log(`package size: ${kb} KiB (budget: ${max} KiB)`);
            if (kb > max) { console.error("package exceeds the size budget"); process.exit(1); }
          '

  test-unit:
    name: Test (Unit)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a1c52d2c570ee84cd1d1d1ff09d64d491e4d47c9 # v6.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Unit tests (coverage)
        run: npm run test:unit
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit
          path: coverage/unit.lcov

  test-integration:
    name: Test (Integration)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a1c52d2c570ee84cd1d1d1ff09d64d491e4d47c9 # v6.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Integration tests (coverage)
        run: npm run test:integration
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-integration
          path: coverage/integration.lcov

  test-smoke:
    name: Test (Smoke)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a1c52d2c570ee84cd1d1d1ff09d64d491e4d47c9 # v6.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Smoke tests (coverage)
        run: npm run test:smoke
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-smoke
          path: coverage/smoke.lcov

  test-fuzz:
    name: Test (Fuzz)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a1c52d2c570ee84cd1d1d1ff09d64d491e4d47c9 # v6.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Fuzz and property-based tests (coverage)
        run: npm run test:fuzz
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-fuzz
          path: coverage/fuzz.lcov

  test-e2e:
    name: Test (E2E)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a1c52d2c570ee84cd1d1d1ff09d64d491e4d47c9 # v6.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: End-to-end tests (coverage)
        run: npm run test:e2e
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-e2e
          path: coverage/e2e.lcov

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-24.04-arm
    needs: [test-unit, test-integration, test-smoke, test-fuzz, test-e2e]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a1c52d2c570ee84cd1d1d1ff09d64d491e4d47c9 # v6.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage/
      - name: Merge tier coverage
        # Writes coverage/summary.md; its first line is the sticky-comment
        # marker "<!-- fixture-app-coverage-report -->".
        run: npm run coverage:merge
      - name: Post sticky PR comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: fixture-app-coverage-report
          path: coverage/summary.md

  docs:
    name: Docs
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a1c52d2c570ee84cd1d1d1ff09d64d491e4d47c9 # v6.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build API docs
        run: npm run docs:build
